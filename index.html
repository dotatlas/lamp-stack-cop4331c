<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Contact Login Page</title>

        <!-- Scripts-->
        <script type="text/javascript" src="js/code.js"></script>
        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <!-- Custom Styles (don't have them yet)-->
        <!--<link href="my-custom-styles.css" rel="stylesheet">-->
    </head>
    
    <body>
        <div class="container py-5">
            <header>
                <h1 id="title">Contacts App</h1>
            </header>

            
            <main>
                <h3>Log in</h3>

                <!--Log in section-->
                <div>
                    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" class="needs-validation">
                            <!--UserName Section-->
                            <p>
                                <label for="username">Username:</label>
                                <input id ="logInUsername" type="text" name="username" id="logInUsername" required autocomplete="on" placeholder="Username">
                            </p>
                            <!--Password Section-->
                            <p>
                                <label for="password">Password:</label>
                                <input id = "logInPassword" type="password" name="password" required placeholder="Password">
                            </p>
                        <button type="submit">Submit</button>
                    </form>
                    <!--Log in section-->
                    <div>
                        <span id="loginResult"></span>
                    </div>
                </div>
                <div>
                    <p>Can't log in?</p>
                </div>
            </main>

            <footer>
                <!--Register Account link at sign up-->
                <p>Don't have an Account? <b><a href="register.html">Sign up</a></b></p>
            </footer>
        </div>
    </body>

</html>
