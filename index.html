<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Contact Login Page</title>

        <!-- Scripts-->

    </head>
    
    <body>
        <header>
            <h1 id="title"> Insert Title</h1>
        </header>

        
        <main>
            <h1>Log in Here</h1>

            <!--Log in section-->
            <div>
                <form>
                        <!--UserName Section-->
                        <p>
                            <label for="username">Username:</label>
                            <input type="text" name="username" id="logInUsername" required autocomplete="on" placeholder="Username">
                        </p>
                        <!--Password Section-->
                        <p>
                            <label for="password">Password:</label>
                            <input type="text" name="password" id="logInPassword" required autocomplete="on" placeholder="Password">
                        </p>
                    <button type="submit">Submit</button>
                </form>
                <!--Log in section-->
                <div>
                    <span id="loginResult"></span>
                </div>
            </div>
            <div>
                <p>Can't log in?</p>
            </div>
        </main>

        <footer>
            <!--Register Account link at sign up-->
            <p>Don't have an Account? <b>Sign up</b></p>
        </footer>

    </body>

</html>
