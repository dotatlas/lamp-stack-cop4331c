<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Contact Login Page</title>

        <!-- Scripts-->
        <script type="text/javascript" src="js/code.js"></script>
        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <!-- Custom Styles -->
        <link href="styles.css" rel="stylesheet">
        <!-- Yellow phonebook as favicon -->
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    
    <body>
	<main>
        <div class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%;">
                <h2 class="text-center mb-4" id="title">Contact Manager</h2>
                <h3 class="text-center text-muted mb-4">Log In</h5>

                <!--Log in section-->
                
                <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" class="needs-validation">
                    <!--UserName Section-->
                    <div class="mb-3">
                        <label for="logInUsername" class="form-label">Username</label>
                        <input id ="logInUsername" type="text" class="form-control" name="username" required autocomplete="on">
                    </div>

                    <!--Password Section-->
                    <div class="mb-3">
                        <label for="logInPassword" class="form-label">Password</label>
                        <input id = "logInPassword" type="password" class="form-control" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>

                    <!--Log in section-->
                    <div id="loginResult" class="mt-3 small text-center"></div>
                </form>                

                <hr class="my-4">
                <p class="text-center text-muted mb-0">
                    Don't have an account? <a href="register.html">Sign up</a>
                </p>
            </div>

        </div>
	</main>
    </body>

</html>
