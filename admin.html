<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Admin Page</title>

        <!-- Scripts-->
        <script type="text/javascript" src="js/code.js"></script>
        <script type="text/javascript">
            document.addEventListener('DOMContentLoaded', function() {
                readCookie();
            }, false);
        </script>
        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    </head>

    <body>
        <div class="container py-5">
            <header>
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <h1 class="h3 mb-0">Contact Manager</h1>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userName" class="text-muted"></span>
                        <button id="logout-button" class="btn btn-outline-secondary btn-sm" onclick="doLogout()">
                                <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>
            </header>

            <main>
                <!--Search Account Card-->
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4">
                            <h2 class="h5 mb-3"><i class="bi bi-search me-2"></i>Search Accounts</h2>
                            <div class="input-group mb-3">
                                <input type="text" id="searchAccount" class="form-control" placeholder="Type an identifier...">
                                <button class="btn btn-primary" type="button" onclick="searchAccount()">Search</button>
                            </div>
                            <!-- Feedback area for search results -->
                            <small id="searchAccountResult" class="text-muted mb-2"></small>
                            
                            <!-- Container for Accounts to show up (up to javascript) -->
                            <div id="accountList" class="mt-2">
                                <p class="text-muted fst-italic">Your accounts will appear here...</p>
                            </div>
                        </div>
                    </div>
                    <!-- Add New admin account on right -->
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4">
                            <h2 class="h5 mb-3"><i class="bi bi-person-plus me-2"></i>Add New Admin Account</h2>
                            <form id="add-contact-form" onsubmit="event.preventDefault(); addAccount(false);">
                                <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" id="firstNameInput" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" id="lastNameInput" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="login" class="form-label">Login</label>
                                <input type="text" id="loginInput" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="passwordInput" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100">Add Contact</button>
                            
                            <!-- Feedback area for add success/errors -->
                            <div id="accountFeedback" class="mt-3 small"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
                </div>
                
            <footer>
        
            </footer>

        </div>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>


</html>
