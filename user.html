<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles (don't have them yet)-->
    <!--<link href="my-custom-styles.css" rel="stylesheet">-->
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h1 class="h3 mb-0">Contact Manager</h1>
            <div class="d-flex align-items-center gap-3">
                <!-- readCookie() in code.js will look for id="userName" for welcome message -->
                <!--<span id="userName" class="text-muted"></span>-->
                <!-- Log out button -->
                <button id="logout-button" class="btn btn-outline-secondary btn-sm" onclick="doLogout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Log Out
                </button>
            </div>
        </div>

        <div class="row g-4">
            <!-- Search Contacts on left -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-4">
                    <h2 class="h5 mb-3"><i class="bi bi-search me-2"></i>Search Contacts</h2>
                    <div class="input-group mb-3">
                        <input type="text" id="searchContacts" class="form-control" placeholder="Type a name...">
                        <button class="btn btn-primary" type="button" onclick="searchContacts()">Search</button>
                    </div>
                    <!-- Feedback area for search results -->
                    <small id="searchContactsResult" class="text-muted mb-2"></small>
                    
                    <!-- Container for contacts to show up (up to javascript) -->
                    <div id="contactList" class="mt-2">
                        <p class="text-muted fst-italic">Your contacts will appear here...</p>
                    </div>
                </div>
            </div>

            <!-- Add New Contact on right -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-4">
                    <h2 class="h5 mb-3"><i class="bi bi-person-plus me-2"></i>Add New Contact</h2>
                    <form id="add-contact-form" onsubmit="event.preventDefault(); addContact();">
                        <div class="mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Add Contact</button>
                        
                        <!-- Feedback area for add success/errors -->
                        <div id="contactAddResult" class="mt-3 small"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Contact Modal -->
     <!-- Need to match id's with updateContact() and deleteContact() in javascript-->
    <div class="modal fade" id="editContactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editContactId">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="editFirstName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="editLastName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="editPhone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="editEmail" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <!-- Red delete button to the left with warning popup -->
                    <button type="button" class="btn btn-danger" onclick="if(confirm('Are you sure you want to delete this contact?')) { deleteContact(); }">
                        <i class="bi bi-trash me-2"></i>Delete
                    </button>
                    <!-- Blue save button and grey cancel button to the right-->
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="updateContact()">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- The javascript file -->
    <script type="text/javascript" src="js/code.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            readCookie(); 
            searchContacts(); 
        });
    </script>
</body>
</html>
