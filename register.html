<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles (don't have them yet)-->
    <!--<link href="my-custom-styles.css" rel="stylesheet">-->
     <!-- The javascript file -->
    <script type=text/javascript src="js/code.js"></script>
</head>

<body>
    <!-- Centers card -->
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%;">
            <h2 class="text-center mb-4">Create Your Account</h2>

            <form id="register-form" onsubmit="event.preventDefault(); addAccount(true);">
                <div class="row">
                    <!--First Name--> 
                    <div class="col-md-6 mb-3">
                        <label for="firstNameInput" class="form-label">First Name</label>
                        <input type="text" id="firstNameInput" class="form-control" required>
                    </div>

                    <!--Last Name--> 
                    <div class="col-md-6 mb-3">
                        <label for="lastNameInput" class="form-label">Last Name</label>
                        <input type="text" id="lastNameInput" class="form-control" required>
                    </div>
                </div>

                <!--Username--> 
                <div class="mb-3">
                    <label for="loginInput" class="form-label">Username</label>
                    <input type="text" id="loginInput" class="form-control" required>
                </div>

                <!--Password--> 
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Password</label>
                    <input type="password" id="passwordInput" class="form-control" required>
                </div>

                <!-- Submit Button-->
                <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>

                <!-- Feedback area for registration success/errors -->
                <div id="accountFeedback" class="mt-3 small text-center"></div>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Already have an account? <a href="index.html">Sign In here</a>
            </p>
        </div>
    </div>

   
</body>
</html>
